name: Portfolio CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  portfolio-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Verificar estructura del portfolio
        run: |
          echo "=== PORTFOLIO CHECK ==="
          echo "Archivos del repo:"
          ls -R

      - name: Verificar README
        run: |
          if [ -f README.md ]; then
            echo "README OK"
          else
            echo "ERROR: falta README"
            exit 1
          fi
